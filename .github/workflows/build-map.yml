name: Build gated community map

on:
  push:
    branches: [main]
  workflow_dispatch:        # "Run workflow" button on the Actions tab
    inputs:
      bbox:
        description: "Search area: SOUTH WEST NORTH EAST (blank = default below)"
        required: false
  schedule:
    - cron: "17 3 * * 1"    # every Monday, to pick up new OpenStreetMap edits

permissions:
  contents: write   # to save results to the map-output branch
  pages: write
  id-token: write

env:
  # Ruaka (west) to Thika Road at Muthaiga (east): Ruaka, Two Rivers, Runda, Gigiri,
  # Muthaiga North, Ridgeways, Garden Estate, Kiambu Road.
  DEFAULT_BBOX: "-1.260 36.745 -1.175 36.865"

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: pip install -r requirements.txt

      - name: Find gated communities
        env:
          GOOGLE_MAPS_API_KEY: ${{ secrets.GOOGLE_MAPS_API_KEY }}
        run: |
          EXTRA=""
          if [ -n "$GOOGLE_MAPS_API_KEY" ]; then EXTRA="--google"; fi
          BBOX="${{ github.event.inputs.bbox }}"
          if [ -z "$BBOX" ]; then BBOX="$DEFAULT_BBOX"; fi
          python find_gated.py --bbox $BBOX --out site $EXTRA
          cp site/gated_map.html site/index.html
          rm -f site/osm_raw.json

      - name: Take pictures of the estates
        continue-on-error: true
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
          python snapshot.py --site site --top 25

      - name: Save results to the map-output branch
        continue-on-error: true
        run: |
          cd site
          git init -q -b map-output
          git add -A
          git -c user.name="github-actions" -c user.email="github-actions@users.noreply.github.com" \
            commit -qm "Map output from run ${{ github.run_number }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" map-output

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
